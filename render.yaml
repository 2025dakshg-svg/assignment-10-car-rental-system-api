# Render Blueprint - https://render.com/docs/blueprint-spec
services:
  - type: web
    name: assignment-10-car-rental-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PORT
        value: 5000